# Deduplicates bronze orders into an Iceberg table in Polaris (step 03.06). A template (D-073): Airflow
# fills in the three arguments from the DAG run parameters (DAG spark_dedup_orders); to run it by hand,
# fill them in first (phase 03 How to Run, 6. Run the Dedup Job).
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: dedup-orders
  namespace: spark
spec:
  type: Python
  mode: cluster
  sparkVersion: 4.0.5
  image: ghcr.io/andrerosalopes/spark:4.0.5-iceberg1.12.0
  # A rebuilt image keeps the same tag (D-054), so nodes must not reuse a cached copy
  imagePullPolicy: Always
  # Script from ConfigMap spark-jobs (D-048)
  mainApplicationFile: local:///opt/spark/jobs/dedup_orders.py
  # Catalog, namespace and table, chosen in the lab (D-073)
  arguments:
    - "{{ params.catalog }}"
    - "{{ params.namespace }}"
    - "{{ params.table }}"
  restartPolicy:
    type: Never
  sparkConf:
    # Bronze through S3A with IRSA only (D-058)
    spark.hadoop.fs.s3a.aws.credentials.provider: software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider
    spark.hadoop.fs.s3a.endpoint.region: us-east-1
    # Polaris as the Iceberg REST catalog "lake" (D-044); warehouse and credential set by the script
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.lake: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lake.type: rest
    spark.sql.catalog.lake.uri: http://polaris.polaris.svc.cluster.local:8181/api/catalog
    spark.sql.catalog.lake.scope: PRINCIPAL_ROLE:ALL
    spark.sql.catalog.lake.token-refresh-enabled: "true"
    spark.sql.catalog.lake.client.region: us-east-1
    # Silver through credentials vended by Polaris (D-049)
    spark.sql.catalog.lake.header.X-Iceberg-Access-Delegation: vended-credentials
    # Keeps the Polaris credential out of the Spark UI and logs
    spark.redaction.regex: (?i)secret|password|token|access[.]?key|credential
  volumes:
    - name: jobs
      configMap:
        name: spark-jobs
  # Spark defaults for cores and memory (D-018): 1 core and 1g per pod, 2 executors
  # Driver and executors are never evicted by node consolidation while they run (D-075)
  driver:
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    serviceAccount: spark
    volumeMounts:
      - name: jobs
        mountPath: /opt/spark/jobs
    # Engines' principal (D-062), from Secret polaris-credentials (D-031)
    envFrom:
      - secretRef:
          name: polaris-credentials
  executor:
    instances: 2
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    serviceAccount: spark
