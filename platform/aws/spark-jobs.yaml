# Spark job scripts as a ConfigMap generated by Kustomize from pipelines/spark (D-048). The
# SparkApplication files there are applied by the user with kubectl, not by Argo CD (D-057).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-jobs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AndreRosaLopes/2026_eks_for_data.git
    targetRevision: main
    path: pipelines/spark
  destination:
    server: https://kubernetes.default.svc
    namespace: spark
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
