# Source Postgres for the transactional ingestion (D-022). The Secret postgres-credentials is
# created by hand from .env before the sync (D-031).
apiVersion: v1
kind: Namespace
metadata:
  name: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: postgres
data:
  # Runs only on the first start, when the volume is empty
  01-schemas.sql: |
    CREATE SCHEMA tpch;
    CREATE SCHEMA oltp;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  # Deleting the StatefulSet also deletes its EBS volume
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          # Logical replication, required by Airbyte CDC
          args: ["-c", "wal_level=logical"]
          env:
            - name: POSTGRES_DB
              value: source
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
          # Requests so Auto Mode sizes the node; limits after measuring (D-018)
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            # Parallel queries need more than the 64 MB default /dev/shm
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
