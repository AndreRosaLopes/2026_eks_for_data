# Catalog Postgres (D-046) as its own Application (D-032); manifests in platform/aws/polaris-postgres.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: polaris-postgres
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AndreRosaLopes/2026_eks_for_data.git
    targetRevision: main
    path: platform/aws/polaris-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: polaris
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
