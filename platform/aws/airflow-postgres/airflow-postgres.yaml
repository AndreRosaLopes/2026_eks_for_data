# Airflow metadata Postgres (D-065), same pattern as the Polaris catalog Postgres (D-046). The Secret
# airflow-postgres-credentials is created by hand from .env before the sync (D-031).
apiVersion: v1
kind: Namespace
metadata:
  name: airflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-postgres-init
  namespace: airflow
data:
  # Runs only on the first start, when the volume is empty: a dedicated user owns the airflow
  # database and has no other rights (as D-061). The password comes from the environment (\getenv),
  # so it is never in a command line or a file.
  01-airflow-user.sh: |
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'EOSQL'
    \getenv pw AIRFLOW_PG_PASSWORD
    CREATE USER airflow WITH LOGIN PASSWORD :'pw';
    ALTER DATABASE airflow OWNER TO airflow;
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
  namespace: airflow
spec:
  selector:
    app: airflow-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgres
  namespace: airflow
spec:
  serviceName: airflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: airflow-postgres
  # Deleting the StatefulSet also deletes its EBS volume
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: airflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_DB
              value: airflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-postgres-credentials
                  key: password
            - name: AIRFLOW_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-postgres-credentials
                  key: airflow-password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
          # No requests: measured first (D-018)
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: airflow-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
